<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee2">
  <title>Tomar mates con Elías</title>
  <style>
    :root{color-scheme:light;--paper:#f4eee2;--ink:#40382e;--muted:#766b5d;--leaf:#65745b;--line:#ded4c3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    main{width:min(100%,620px);text-align:center;padding:clamp(28px,7vw,64px) 20px}
    .mate{font-size:54px;line-height:1;margin-bottom:28px}
    .eyebrow{font:12px/1.5 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf)}
    h1{font-size:clamp(36px,8vw,58px);font-weight:normal;line-height:1.06;margin:18px 0}
    p{font-size:18px;line-height:1.7;color:var(--muted);max-width:430px;margin:0 auto}
    .rule{width:56px;height:1px;background:var(--line);margin:30px auto}
    footer{font:12px/1.6 system-ui,sans-serif;color:var(--muted);letter-spacing:.04em}
  </style>
</head>
<body>
  <main>
    <div class="mate" aria-hidden="true">🧉</div>
    <div class="eyebrow">Un lugar sin apuro</div>
    <h1>Tomar mates<br>con Elías</h1>
    <div class="rule"></div>
    <p>Estamos preparando este rinconcito desde cero. Pronto habrá una mesa, un mate y tiempo para quedarse un rato.</p>
    <div class="rule"></div>
    <footer>Sin apuro. Sin obligación. A tu tiempo.</footer>
  </main>
</body>
</html>
